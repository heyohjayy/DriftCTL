[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "infra-drift-control"
version = "1.0.0"
description = "A local, policy-driven Terraform-to-AWS drift detection engine."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "boto3>=1.34,<2",
  "rich>=13,<14",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["build>=1,<2", "pytest>=8,<9"]

[project.urls]
Homepage = "https://github.com/heyohjayy/DriftCTL"
Repository = "https://github.com/heyohjayy/DriftCTL"
Issues = "https://github.com/heyohjayy/DriftCTL/issues"

[project.scripts]
driftctl = "driftctl.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/driftctl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
