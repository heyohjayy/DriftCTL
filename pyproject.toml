[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "infra-drift-control"
version = "0.1.0"
description = "A local, policy-driven Terraform-to-AWS drift detection engine."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.34,<2",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
driftctl = "driftctl.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/driftctl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
